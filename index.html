<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏫 二上学习小屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --cream:#F5F0E6; --turquoise:#7ECDC0; --soft-pink:#F7C8D4; --butter:#FDE68A;
    --mint:#A8E6CF; --lavender:#D4A5E8; --peach:#FFCBA4; --sky:#A8D8F0; --coral:#F8635F;
    --ink:#2D2D2D; --muted:#6B6B6B; --white:#FFFFFF;
    --bw:3px; --radius:20px; --radius-lg:28px;
    --shadow:6px 6px 0 var(--ink); --shadow-sm:4px 4px 0 var(--ink);
    --font-display:'Fredoka One','ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',cursive;
    --font-body:'Quicksand','ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;
  }
  body {
    font-family:var(--font-body); font-weight:500;
    background:var(--cream); color:var(--ink);
    min-height:100vh; display:flex; justify-content:center;
    padding:20px 14px 48px; position:relative; overflow-x:hidden;
  }
  #app { width:100%; max-width:540px; position:relative; z-index:2; }

  /* ---------- 手绘贴纸装饰 ---------- */
  .deco { position:fixed; pointer-events:none; z-index:1; opacity:.95; }
  .deco svg { width:100%; height:100%; display:block; }
  .deco-1 { width:64px; top:18px; left:12px; transform:rotate(-14deg); }
  .deco-2 { width:46px; top:110px; right:16px; transform:rotate(12deg); }
  .deco-3 { width:58px; bottom:60px; left:8px; transform:rotate(8deg); }
  .deco-4 { width:44px; top:44px; right:110px; transform:rotate(20deg); }
  @media (max-width:600px){ .deco{ display:none; } }

  /* ---------- 通用卡片 ---------- */
  .card {
    background:var(--white); border:var(--bw) solid var(--ink);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:20px; margin-bottom:20px;
  }

  /* ---------- 顶部标题 ---------- */
  .top { text-align:center; margin-bottom:22px; }
  .top h1 {
    font-family:var(--font-display); font-weight:400; letter-spacing:.02em;
    font-size:32px; color:var(--ink);
    text-shadow:3px 3px 0 var(--butter);
  }
  .top .sub {
    display:inline-block; margin-top:10px;
    background:var(--white); border:2px solid var(--ink); border-radius:50px;
    padding:5px 18px; font-size:12px; font-weight:600; color:var(--muted);
    box-shadow:3px 3px 0 var(--ink);
  }

  /* ---------- 学科入口 ---------- */
  .subjects { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .subject {
    display:flex; flex-direction:column; align-items:center; gap:6px;
    text-decoration:none; color:var(--ink);
    border:var(--bw) solid var(--ink); border-radius:var(--radius-lg);
    box-shadow:var(--shadow); padding:20px 10px 16px;
    transition:transform .08s, box-shadow .08s;
  }
  .subject:active { transform:translate(4px,4px); box-shadow:2px 2px 0 var(--ink); }
  .subject .ico { font-size:40px; line-height:1; }
  .subject .name { font-family:var(--font-display); font-size:18px; }
  .subject .desc { font-size:11px; font-weight:600; color:var(--muted); }
  .subject.math    { background:var(--mint); }
  .subject.chinese { background:var(--soft-pink); }
  .subject.english { background:var(--sky); }
  .subject.more    { background:var(--butter); }
  .subject.soon { opacity:.55; cursor:not-allowed; }
  .subject.soon .tag {
    font-size:10px; background:var(--white); border:2px solid var(--ink);
    border-radius:50px; padding:2px 10px; font-weight:700; margin-top:2px;
  }

  /* ---------- 打卡横幅 ---------- */
  .banner {
    background:var(--peach); display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .banner .fire { font-size:15px; font-weight:700; }
  .banner .tip { font-size:12px; font-weight:600; color:#4a6a5e; margin-top:4px; }
  .badge {
    flex-shrink:0; border:2px solid var(--ink); border-radius:50px;
    padding:6px 14px; font-size:12px; font-weight:700; background:var(--white); color:var(--muted);
    box-shadow:3px 3px 0 var(--ink);
  }
  .badge.full { background:var(--turquoise); color:#fff; }
  .badge.part { background:var(--butter); color:var(--ink); }

  /* ---------- 打卡日历 ---------- */
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-head .title { font-family:var(--font-display); font-size:17px; }
  .cal-head button {
    font-family:var(--font-display); font-size:15px; cursor:pointer;
    width:38px; height:38px; border:2px solid var(--ink); border-radius:12px;
    background:var(--butter); box-shadow:3px 3px 0 var(--ink);
    transition:transform .08s, box-shadow .08s;
  }
  .cal-head button:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center; }
  .cal-grid .dow { font-size:11px; font-weight:700; color:var(--muted); padding:4px 0; }
  .cal-grid .day {
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; border:2px solid var(--ink); border-radius:50%;
    background:var(--white);
  }
  .cal-grid .day.blank { border:none; background:transparent; }
  .cal-grid .day.full { background:var(--turquoise); color:#fff; box-shadow:2px 2px 0 var(--ink); }
  .cal-grid .day.part { background:var(--butter); box-shadow:2px 2px 0 var(--ink); }
  .cal-grid .day.future { opacity:.35; }
  .cal-grid .day.today { outline:2px dashed var(--coral); outline-offset:2px; }
  .legend { display:flex; gap:14px; justify-content:center; margin-top:14px; font-size:11px; font-weight:600; color:var(--muted); flex-wrap:wrap; }
  .legend i {
    display:inline-block; width:12px; height:12px; border-radius:50%;
    border:2px solid var(--ink); margin-right:4px; vertical-align:-1px;
  }
  .legend .l-full { background:var(--turquoise); }
  .legend .l-part { background:var(--butter); }
  .legend .l-today { background:var(--white); outline:2px dashed var(--coral); outline-offset:1px; }
</style>
</head>
<body>
  <!-- 手绘贴纸装饰 -->
  <div class="deco deco-1"><svg viewBox="0 0 64 64"><g stroke="#2D2D2D" stroke-width="2.5"><circle cx="32" cy="32" r="9" fill="#F8635F"/><g id="p"><ellipse cx="32" cy="14" rx="6" ry="10" fill="#FDE68A"/></g><use href="#p" transform="rotate(60 32 32)"/><use href="#p" transform="rotate(120 32 32)"/><use href="#p" transform="rotate(180 32 32)"/><use href="#p" transform="rotate(240 32 32)"/><use href="#p" transform="rotate(300 32 32)"/></g></svg></div>
  <div class="deco deco-2"><svg viewBox="0 0 46 46"><path d="M23 4l5 12 13 1-10 8 3 13-11-7-11 7 3-13-10-8 13-1z" fill="#FDE68A" stroke="#2D2D2D" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
  <div class="deco deco-3"><svg viewBox="0 0 58 40"><path d="M14 32a10 10 0 1 1 2-19 12 12 0 0 1 23 2 9 9 0 0 1 1 17z" fill="#A8D8F0" stroke="#2D2D2D" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
  <div class="deco deco-4"><svg viewBox="0 0 44 44"><g stroke="#2D2D2D" stroke-width="2.5"><circle cx="22" cy="22" r="7" fill="#A8E6CF"/><g id="pp"><ellipse cx="22" cy="9" rx="4.5" ry="8" fill="#F7C8D4"/></g><use href="#pp" transform="rotate(72 22 22)"/><use href="#pp" transform="rotate(144 22 22)"/><use href="#pp" transform="rotate(216 22 22)"/><use href="#pp" transform="rotate(288 22 22)"/></g></svg></div>

  <div id="app">
    <div class="top">
      <h1>🏫 二上学习小屋</h1>
      <div class="sub">二年级上册 · 练一练 学一学 ✏️</div>
    </div>

    <!-- 学科入口 -->
    <div class="subjects">
      <a class="subject math" href="math/koucalc.html">
        <span class="ico">🧮</span>
        <span class="name">数学</span>
        <span class="desc">口算打卡 · 自动出题批改</span>
      </a>
      <a class="subject chinese" href="chinese/yuwen.html">
        <span class="ico">📖</span>
        <span class="name">语文</span>
        <span class="desc">课文 · 生字卡 · 答题挑战</span>
      </a>
      <div class="subject english soon">
        <span class="ico">🔤</span>
        <span class="name">英语</span>
        <span class="desc">单词闪卡 · 跟读</span>
        <span class="tag">敬请期待</span>
      </div>
      <div class="subject more soon">
        <span class="ico">🎨</span>
        <span class="name">更多</span>
        <span class="desc">古诗 · 科普 · 益智</span>
        <span class="tag">敬请期待</span>
      </div>
    </div>

    <!-- 打卡横幅 -->
    <div class="card banner">
      <div>
        <div class="fire" id="streakText">🔥 连续打卡 0 天</div>
        <div class="tip" id="todayText">今天还没有打卡哦～</div>
      </div>
      <div class="badge" id="todayFlag">今日未打卡</div>
    </div>

    <!-- 打卡日历 -->
    <div class="card">
      <div class="cal-head">
        <button id="prevMonth">◀</button>
        <div class="title" id="calTitle">—</div>
        <button id="nextMonth">▶</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="legend">
        <span><i class="l-full"></i>全对打卡</span>
        <span><i class="l-part"></i>打卡有错</span>
        <span><i class="l-today"></i>今天</span>
      </div>
    </div>
  </div>

<script>
/* ================= 打卡数据（与口算页共用同一 localStorage） ================= */
const KEY='koucalc_checkin_v1';
function loadRec(){ try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {}; } }
function fmtKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function calcStreak(rec){
  let s=0; const d=new Date();
  for(let i=0;i<365;i++){
    const k=fmtKey(d);
    if(rec[k]) s++; else if(i>0) break;
    d.setDate(d.getDate()-1);
  }
  return s;
}

/* ================= 日历 ================= */
const now0=new Date();
let calY=now0.getFullYear(), calM=now0.getMonth();
function renderCalendar(){
  document.getElementById('calTitle').textContent=calY+'年'+(calM+1)+'月';
  const firstDow=(new Date(calY,calM,1).getDay()+6)%7;      // 周一开头
  const dim=new Date(calY,calM+1,0).getDate();
  const todayKey=fmtKey(new Date());
  const rec=loadRec();
  const dows=['一','二','三','四','五','六','日'];
  let html=dows.map(w=>`<span class="dow">${w}</span>`).join('');
  for(let i=0;i<firstDow;i++) html+='<span class="day blank"></span>';
  for(let d=1;d<=dim;d++){
    const key=fmtKey(new Date(calY,calM,d));
    const r=rec[key];
    let cls='day';
    if(r&&r.acc===100) cls+=' full';
    else if(r) cls+=' part';
    if(key>todayKey) cls+=' future';
    if(key===todayKey) cls+=' today';
    html+=`<span class="${cls}">${d}</span>`;
  }
  document.getElementById('calGrid').innerHTML=html;
}
document.getElementById('prevMonth').onclick=()=>{ calM--; if(calM<0){calM=11;calY--;} renderCalendar(); };
document.getElementById('nextMonth').onclick=()=>{ calM++; if(calM>11){calM=0;calY++;} renderCalendar(); };

/* ================= 今日状态 ================= */
function renderBanner(){
  const rec=loadRec(), t=fmtKey(new Date()), streak=calcStreak(rec);
  document.getElementById('streakText').textContent=`🔥 连续打卡 ${streak} 天`;
  document.getElementById('todayText').textContent = rec[t] ? `今天已打卡 ✅ 正确率 ${rec[t].acc}%` : '今天还没有打卡哦～去数学练一练吧！';
  const flag=document.getElementById('todayFlag');
  if(rec[t]){
    flag.textContent = rec[t].acc===100 ? '🌟 今日全对！' : `今日 ${rec[t].acc}%`;
    flag.className = 'badge ' + (rec[t].acc===100 ? 'full' : 'part');
  } else {
    flag.textContent='今日未打卡'; flag.className='badge';
  }
}
renderBanner(); renderCalendar();
</script>
</body>
</html>
