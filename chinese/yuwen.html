<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>📖 语文小课堂 · 二上</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --cream:#F5F0E6; --turquoise:#7ECDC0; --soft-pink:#F7C8D4; --butter:#FDE68A;
    --mint:#A8E6CF; --lavender:#D4A5E8; --peach:#FFCBA4; --sky:#A8D8F0; --coral:#F8635F;
    --ink:#2D2D2D; --muted:#6B6B6B; --white:#FFFFFF;
    --bw:3px; --radius:20px; --radius-lg:28px;
    --shadow:6px 6px 0 var(--ink); --shadow-sm:4px 4px 0 var(--ink);
    --font-display:'Fredoka One','ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',cursive;
    --font-body:'Quicksand','ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;
  }
  body { font-family:var(--font-body); font-weight:500; background:var(--cream); color:var(--ink);
    min-height:100vh; display:flex; justify-content:center; padding:18px 12px 90px; }
  #app { width:100%; max-width:560px; position:relative; z-index:2; }
  .hidden { display:none !important; }

  .top { text-align:center; margin-bottom:16px; }
  .top h1 { font-family:var(--font-display); font-weight:400; font-size:30px; text-shadow:3px 3px 0 var(--butter); }
  .top a.home {
    display:inline-block; margin-top:8px; text-decoration:none; color:var(--ink);
    background:var(--white); border:2px solid var(--ink); border-radius:50px;
    padding:4px 16px; font-size:12px; font-weight:700; box-shadow:3px 3px 0 var(--ink);
  }

  /* tab 栏 */
  .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px; }
  .tab {
    font-family:var(--font-display); font-size:14px; text-align:center; cursor:pointer;
    padding:10px 2px; border:2px solid var(--ink); border-radius:16px;
    background:var(--white); box-shadow:3px 3px 0 var(--ink); transition:transform .08s, box-shadow .08s;
    user-select:none;
  }
  .tab:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .tab.on { background:var(--coral); color:#fff; }

  .card { background:var(--white); border:var(--bw) solid var(--ink); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; margin-bottom:16px; }
  .btn {
    font-family:var(--font-display); font-size:14px; cursor:pointer; color:var(--ink);
    border:2px solid var(--ink); border-radius:14px; background:var(--butter);
    box-shadow:3px 3px 0 var(--ink); padding:9px 16px; transition:transform .08s, box-shadow .08s;
    user-select:none;
  }
  .btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .btn.small { font-size:12px; padding:6px 12px; box-shadow:2px 2px 0 var(--ink); }
  .btn.pink { background:var(--soft-pink); }
  .btn.mint { background:var(--mint); }
  .btn.sky  { background:var(--sky); }
  .btn.on   { background:var(--coral); color:#fff; }

  /* ---------- 课文列表 ---------- */
  .unit-title { font-family:var(--font-display); font-size:15px; margin:18px 4px 10px; }
  .lesson-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .lesson {
    background:var(--white); border:2px solid var(--ink); border-radius:16px;
    box-shadow:var(--shadow-sm); padding:10px 12px; cursor:pointer; user-select:none;
    transition:transform .08s, box-shadow .08s;
  }
  .lesson:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .lesson .no { font-size:10px; font-weight:700; color:var(--muted); }
  .lesson .nm { font-family:var(--font-display); font-size:14px; margin-top:2px; }
  .lesson .st { font-size:10px; font-weight:700; margin-top:4px; color:var(--muted); }
  .lesson .st.done { color:#fff; background:var(--turquoise); display:inline-block;
    border:1.5px solid var(--ink); border-radius:50px; padding:1px 8px; }

  /* ---------- 课文详情 ---------- */
  .detail-head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .detail-head h2 { font-family:var(--font-display); font-size:20px; }
  .sum-box { background:var(--butter); border:2px solid var(--ink); border-radius:14px; padding:10px 12px; font-size:13px; margin-bottom:10px; }
  .sum-box b, .ana-box b { font-family:var(--font-display); font-size:12px; display:block; margin-bottom:4px; }
  .ana-box { background:var(--sky); border:2px solid var(--ink); border-radius:14px; padding:10px 12px; font-size:13px; margin-bottom:12px; }
  .text-box { background:var(--cream); border:2px dashed var(--ink); border-radius:14px; padding:12px;
    font-size:15px; line-height:1.9; margin-bottom:12px; max-height:260px; overflow-y:auto; }
  .chip-title { font-family:var(--font-display); font-size:12px; margin:8px 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chip {
    border:2px solid var(--ink); border-radius:12px; background:var(--mint);
    padding:4px 8px; text-align:center; cursor:pointer; user-select:none;
    box-shadow:2px 2px 0 var(--ink); transition:transform .08s, box-shadow .08s;
  }
  .chip:active { transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }
  .chip.xie { background:var(--soft-pink); }
  .chip.w { background:var(--butter); min-width:52px; }
  .chip .z { font-size:16px; font-weight:700; display:block; }
  .chip .p { font-size:9px; color:var(--muted); display:block; }
  .back { margin-bottom:12px; }

  /* ---------- 生字卡 ---------- */
  .filter-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .flash-wrap { text-align:center; }
  .flash {
    width:230px; height:230px; margin:0 auto 14px; border:var(--bw) solid var(--ink);
    border-radius:var(--radius-lg); background:var(--white); box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; position:relative; transition:transform .1s;
  }
  .flash:active { transform:scale(.98); }
  .flash .big { font-size:110px; font-family:var(--font-display); line-height:1; }
  .flash .py { font-size:22px; color:var(--coral); font-weight:700; margin-top:6px; font-family:var(--font-display); }
  .flash .wds { font-size:14px; color:var(--muted); margin-top:8px; padding:0 14px; }
  .flash .hint { position:absolute; top:10px; right:12px; font-size:10px; color:var(--muted); }
  .flash .idx { position:absolute; top:10px; left:12px; font-size:10px; color:var(--muted); font-weight:700; }
  .flash-nav { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  /* ---------- 古诗 ---------- */
  .poem-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; gap:6px; }
  .poem-head h3 { font-family:var(--font-display); font-size:17px; }
  .poem-head .au { font-size:11px; color:var(--muted); font-weight:700; }
  .poem-line { font-size:16px; line-height:2; cursor:pointer; user-select:none; }
  .poem-line:hover { color:var(--coral); }

  /* ---------- 答题 ---------- */
  .q-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .q-head .prog { font-family:var(--font-display); font-size:13px; }
  .q-bar { height:10px; border:2px solid var(--ink); border-radius:50px; background:var(--white); overflow:hidden; margin-bottom:16px; }
  .q-bar i { display:block; height:100%; background:var(--turquoise); width:0; transition:width .3s; }
  .q-text { font-size:18px; font-weight:700; margin-bottom:16px; line-height:1.6; text-align:center; }
  .q-text .zi { font-size:64px; font-family:var(--font-display); display:block; margin-bottom:8px; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opt {
    font-family:var(--font-display); font-size:17px; text-align:center; padding:16px 8px;
    border:2px solid var(--ink); border-radius:16px; background:var(--white);
    box-shadow:var(--shadow-sm); cursor:pointer; user-select:none;
    transition:transform .08s, box-shadow .08s;
  }
  .opt:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .opt.right { background:var(--turquoise); color:#fff; }
  .opt.wrong { background:var(--coral); color:#fff; animation:shake .3s; }
  @keyframes shake { 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .q-feed { text-align:center; min-height:26px; font-family:var(--font-display); font-size:15px; margin-top:14px; }
  .result-stars { text-align:center; font-size:44px; margin:6px 0; }
  .result-nums { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; }
  .rnum { border:2px solid var(--ink); border-radius:14px; padding:8px 14px; background:var(--cream);
    box-shadow:3px 3px 0 var(--ink); text-align:center; }
  .rnum b { font-family:var(--font-display); font-size:18px; display:block; }
  .rnum span { font-size:10px; color:var(--muted); font-weight:700; }
  .center { text-align:center; }
  .sel-row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:14px; }
  .conf-label { font-family:var(--font-display); font-size:13px; margin:10px 0 6px; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1>📖 语文小课堂</h1>
    <a class="home" href="../index.html">🏠 回学习大厅</a>
  </div>

  <div class="tabs">
    <div class="tab on" data-v="course">📚 课文</div>
    <div class="tab" data-v="cards">🃏 生字卡</div>
    <div class="tab" data-v="poem">🏰 古诗</div>
    <div class="tab" data-v="quiz">🎯 答题</div>
  </div>

  <div id="v-course"></div>
  <div id="v-detail" class="hidden"></div>

  <div id="v-quiz" class="hidden"></div>
</div>

<script>
/* ================= 数据 ================= */
const DATA = {"book":"人教版二年级上册语文（2025秋版）","lessons":[{"sec":"阅读","no":1,"title":"小蝌蚪找妈妈","ren":[{"z":"蝌","p":"kē"},{"z":"蚪","p":"dǒu"},{"z":"脑","p":"nǎo"},{"z":"袋","p":"dài"},{"z":"灰","p":"huī"},{"z":"甩","p":"shuǎi"},{"z":"活","p":"huó"},{"z":"腿","p":"tuǐ"},{"z":"教","p":"jiào"},{"z":"迎","p":"yíng"},{"z":"嘴","p":"zuǐ"},{"z":"龟","p":"guī"},{"z":"披","p":"pī"},{"z":"蹲","p":"dūn"},{"z":"肚","p":"dù"},{"z":"鼓","p":"gǔ"}],"xie":[{"z":"两","p":"liǎng"},{"z":"条","p":"tiáo"},{"z":"哪","p":"nǎ"},{"z":"宽","p":"kuān"},{"z":"那","p":"nà"},{"z":"短","p":"duǎn"},{"z":"孩","p":"hái"},{"z":"成","p":"chéng"}],"words":["花园","飞鸟","红领巾","欢笑"],"text":"池塘里有一群小蝌蚪，大大的脑袋，黑灰色的身子，甩着长长的尾巴，快活地游来游去小蝌蚪游哇游，过了几天，长出了两条后腿。他们看见鲤鱼妈妈在教小鲤鱼捕食就迎上去，问鲤鱼阿姨，我们的妈妈在哪里鲤鱼妈妈说你们的妈妈四条腿，宽嘴巴。你们到那边去找吧小蝌蚪游哇游过了几天，长出了两条前腿。他们看见一只乌龟摆动着四条腿在水里游，连忙追上去，叫着妈妈，妈妈乌龟笑着说我不是你们的妈妈。你们的妈妈头顶上有两只大眼睛，披着绿衣裳。你们到那边去找吧小蝌蚪游哇游，过了几天，尾巴变短了。他们游到荷花旁边，看见荷叶上蹲着一只大青蛙，披着碧绿的衣裳，露着雪白的肚皮，鼓着一对大眼睛小蝌蚪游过去，叫着妈妈，妈妈青蛙妈妈低头一看，笑着说好孩子，你们已经长成青蛙了，快跳上来吧他们后腿一蹬，向前一跳蹦到了荷叶上不知什么时候，小青蛙的尾巴已经不见了。","sum":"小蝌蚪先长出两条后腿，再长出前腿，尾巴变短最后消失，一路问着鲤鱼阿姨和乌龟，终于找到了青蛙妈妈。","ana":"科普童话。按\"长后腿→长前腿→尾巴变短→变成青蛙\"的时间顺序，把青蛙成长过程讲清楚；鲤鱼、乌龟两次指路推动故事，\"迎上去\"\"追上去\"用词准确，读一读比一比。","quiz":[{"q":"小蝌蚪先长出的是什么？","opts":["两条后腿","两条前腿","翅膀"],"a":0},{"q":"青蛙妈妈长什么样？","opts":["白肚皮长尾巴","头顶有大眼睛披着绿衣裳","四条腿宽嘴巴没有眼睛"],"a":1}]},{"sec":"阅读","no":2,"title":"我是什么","ren":[{"z":"汽","p":"qì"},{"z":"越","p":"yuè"},{"z":"温","p":"wēn"},{"z":"滴","p":"dī"},{"z":"奔","p":"bēn"},{"z":"海","p":"hǎi"},{"z":"洋","p":"yáng"},{"z":"发","p":"fā"},{"z":"坏","p":"huài"},{"z":"没","p":"méi"},{"z":"庄","p":"zhuāng"},{"z":"稼","p":"jià"},{"z":"屋","p":"wū"},{"z":"带","p":"dài"},{"z":"灾","p":"zāi"},{"z":"种","p":"zhǒng"},{"z":"管","p":"guǎn"}],"xie":[{"z":"升","p":"shēng"},{"z":"连","p":"lián"},{"z":"起","p":"qǐ"},{"z":"海","p":"hǎi"},{"z":"洋","p":"yáng"},{"z":"许","p":"xǔ"},{"z":"作","p":"zuò"},{"z":"办","p":"bàn"},{"z":"法","p":"fǎ"}],"words":["杨树","树叶","松柏","化石","开花"],"text":"我会变。太阳一晒，我就变成汽。升到天空，我又变成无数极小极小的点儿，连成一片，在空中飘浮。有时候我穿着白衣服有时候我穿着黑衣服，早晨和傍晚我又把红袍披在身上。人们叫我云我在空中越升越高，体温越来越低，变成了无数小水滴。小水滴聚在一起落下来人们叫我雨。有时候我变成小硬球打下来，人们就叫我冰雹。到了冬天，我变成小花朵飘下来，人们又叫我雪在儿化词中，儿不单独发音，注音时在前面的音节后加，表示一个卷舌的动作。平常我在池子里睡觉，在小溪里散步在江河里奔跑，在海洋里跳舞，唱歌，开大会有时候我很温和，有时候我却很暴躁我做过许多好事，灌溉田地，发动机器，帮助人们工作。我也做过许多坏事，淹没庄稼，冲毁房屋，给人们带来灾害。","sum":"\"我\"会变：太阳一晒变成汽，升上天空变成云，落下来就是雨、雹子、雪；平时在池子睡觉、小溪散步、江河奔跑、海洋跳舞。","ana":"猜谜式拟人科普文。抓住\"水\"的三态变化这条线；\"有时候……有时候……\"写变化，\"在池子里睡觉，在小溪里散步\"用排比把水的不同状态写活了。","quiz":[{"q":"\"我\"变成云以后又叫什么？","opts":["汽","云","冰"],"a":1},{"q":"\"我\"平时在池子里做什么？","opts":["跑步","睡觉","唱歌"],"a":1}]},{"sec":"阅读","no":3,"title":"植物妈妈有办法","ren":[{"z":"植","p":"zhí"},{"z":"如","p":"rú"},{"z":"脚","p":"jiǎo"},{"z":"旅","p":"lǚ"},{"z":"准","p":"zhǔn"},{"z":"备","p":"bèi"},{"z":"送","p":"sòng"},{"z":"纷","p":"fēn"},{"z":"挂","p":"guà"},{"z":"挺","p":"tǐng"},{"z":"钻","p":"zuān"},{"z":"底","p":"dǐ"},{"z":"炸","p":"zhà"},{"z":"离","p":"lí"},{"z":"粗","p":"cū"},{"z":"得","p":"dé"}],"xie":[{"z":"如","p":"rú"},{"z":"已","p":"yǐ"},{"z":"经","p":"jīng"},{"z":"别","p":"bié"},{"z":"轻","p":"qīng"},{"z":"发","p":"fā"},{"z":"胆","p":"dǎn"},{"z":"肚","p":"dù"},{"z":"更","p":"gèng"},{"z":"识","p":"shí"}],"words":["拍手","世界","云彩","丛林","竹林","朋友","保护"],"text":"孩子如果已经长大就得告别妈妈，四海为家牛马有脚，鸟有翅膀植物旅行又用什么办法蒲公英妈妈准备了降落伞把它送给自己的娃娃只要有风轻轻吹过孩子们就乘着风纷纷出发苍耳妈妈有个好办法她给孩子穿上带刺的铠甲只要挂住动物的皮毛孩子们就能去田野、山洼植物妈妈有办法石榴妈妈的胆子挺大她不怕小鸟吃掉娃娃孩子们在鸟肚子里睡上一觉就会钻出来落户安家豌豆妈妈更有办法她让豆荚晒在太阳底下啪的一声，豆荚炸开孩子们就蹦着跳着离开妈妈植物妈妈的办法很多很多不信你就仔细观察那里有许许多多的知识粗心的小朋友却得不到它","sum":"植物妈妈有办法：蒲公英乘着风、苍耳挂住动物皮毛、豌豆让太阳晒后蹦跳着去旅行。","ana":"拟人诗歌，每节写一种植物传播种子的办法。\"降落伞\"\"带刺的铠甲\"比喻形象；最后告诉我们：仔细观察就能得到大自然的知识。","quiz":[{"q":"蒲公英妈妈给孩子准备了什么？","opts":["降落伞","铠甲","豆荚"],"a":0},{"q":"苍耳的种子靠什么去旅行？","opts":["风吹","挂住动物的皮毛","太阳晒"],"a":1}]},{"sec":"园地","no":"一","title":"语文园地一","ren":[{"z":"朗","p":"lǎng"},{"z":"雾","p":"wù"},{"z":"暴","p":"bào"},{"z":"雷","p":"léi"},{"z":"阵","p":"zhèn"},{"z":"冻","p":"dòng"},{"z":"夹","p":"jiā"}],"xie":[{"z":"转","p":"zhuǎn"},{"z":"夹","p":"jiā"}],"words":[],"text":""},{"sec":"识字","no":1,"title":"场景歌","ren":[{"z":"帆","p":"fān"},{"z":"港","p":"gǎng"},{"z":"湾","p":"wān"},{"z":"塘","p":"táng"},{"z":"稻","p":"dào"},{"z":"行","p":"xíng"},{"z":"垂" },{"z":"拿","p":"ná"},{"z":"系","p":"xì"},{"z":"荡","p":"dàng"},{"z":"裙","p":"qún"}],"xie":[{"z":"丽","p":"lì"},{"z":"提","p":"tí"},{"z":"吗","p":"ma"},{"z":"圆","p":"yuán"},{"z":"哥","p":"gē"},{"z":"秋","p":"qiū"},{"z":"挂","p":"guà"},{"z":"啊","p":"a"}],"words":["天上","美丽","爸爸","下来","不用","高兴","哥哥","秋千","彩云"],"text":"雨停了，天上出现了一座美丽的桥爸爸，您浇花用的那把水壶呢？如果我提着它，走到桥上，把水洒下来，那不就是我在下雨吗？您就不用挑水去浇田了，您高兴吗妈妈，您梳头用的那面镜子呢？如果我拿着它，走到桥上，天上不就多了一个月亮吗？我拿着圆圆的月亮照着您梳头，您高兴吗彩虹哥哥，你系在门前树上的秋千呢？如果我把它挂在彩虹桥上，坐着秋千荡来荡去，花裙子飘啊飘的，不就成了一朵彩云吗？","sum":"\"我\"把雨后的彩虹想象成一座桥：想帮爸爸浇田、帮妈妈照镜子、陪哥哥荡秋千，让家人都高兴。","ana":"充满童趣的想象文。三个段落结构相同：先喊称呼，再问\"那不是……吗\"，最后\"您/你就高兴吗\"——想象都为了让家人开心，读来温馨。","quiz":[{"q":"\"我\"把彩虹想象成了什么？","opts":["滑梯","一座桥","一条船"],"a":1},{"q":"\"我\"想在彩虹上帮哥哥做什么？","opts":["浇田","照镜子","荡秋千"],"a":2}]},{"sec":"阅读","no":5,"title":"去外婆家","ren":[{"z":"婆","p":"pó"},{"z":"候","p":"hòu"},{"z":"趣","p":"qù"},{"z":"舅","p":"jiù"},{"z":"或","p":"huò"},{"z":"留","p":"liú"},{"z":"份","p":"fèn"},{"z":"喂","p":"wèi"},{"z":"逃","p":"táo"},{"z":"曲","p":"qū"},{"z":"者","p":"zhě"},{"z":"服","p":"fú"},{"z":"扑","p":"pū"},{"z":"鼻","p":"bí"}],"xie":[{"z":"宝","p":"bǎo"},{"z":"活","p":"huó"},{"z":"些","p":"xiē"},{"z":"总","p":"zǒng"},{"z":"给","p":"gěi"},{"z":"诉","p":"sù"},{"z":"曲","p":"qū"},{"z":"名","p":"míng"},{"z":"香","p":"xiāng"}],"words":["宝贝","干活","回来","一些","天气","欢快","它们","告诉","名字","出门"],"text":"小时候，我最大的乐趣就是去外婆家外婆的家在山脚下。山上山下宝贝多有吃的，有玩的，还有看的有时候舅舅从山上干活回来，会带一些山楂、柿子或毛栗子，外婆总要给我留一份天气好的时候，在屋后的山上玩，会看到一只只小山雀在林间欢快地蹦来跳去，它们是我最喜欢的宝贝。外婆告诉我，从小喂大的山雀不会逃，唧唧一叫，就飞到你手上，唱支小曲给你听每到春天，外婆家屋后的山上，开满了姹紫嫣红的杜鹃花，还有许许多多说不出名字的野花。","sum":"小时候最大的乐趣是去外婆家：山上山下宝贝多，舅舅带回山货野果，外婆端出好吃的小吃，路上还能看风景。","ana":"回忆性散文，语言亲切。\"宝贝多\"总起，再分写有吃的、有玩的、有看的；字里行间是对外婆家和童年的怀念。","quiz":[{"q":"外婆的家在哪里？","opts":["山脚下","海边","城市里"],"a":0},{"q":"课文说去外婆家路上有什么？","opts":["宝贝多","高楼大厦","游乐场"],"a":0}]},{"sec":"阅读","no":6,"title":"数星星的孩子","ren":[{"z":"珍","p":"zhēn"},{"z":"撒","p":"sā"},{"z":"碧","p":"bì"},{"z":"靠","p":"kào"},{"z":"仰","p":"yǎng"},{"z":"颗","p":"kē"},{"z":"距","p":"jù"},{"z":"变","p":"biàn"},{"z":"祖","p":"zǔ"},{"z":"勺","p":"sháo"},{"z":"绕","p":"rào"},{"z":"转","p":"zhuǎn"},{"z":"楚","p":"chǔ"},{"z":"汉","p":"hàn"},{"z":"刻","p":"kè"},{"z":"研","p":"yán"}],"xie":[{"z":"数","p":"shù"},{"z":"晚","p":"wǎn"},{"z":"奶","p":"nǎi"},{"z":"您","p":"nín"},{"z":"爷","p":"yé"},{"z":"很","p":"hěn"},{"z":"变","p":"biàn"},{"z":"勺","p":"sháo"},{"z":"张","p":"zhāng"},{"z":"汉","p":"hàn"}],"words":["星星","晚上","无数","奶奶","中间","总是","爷爷","北边","勺子","转动","这个","后来"],"text":"晚上，满天的星星像无数珍珠撒在碧玉盘里。一个孩子坐在院子里，靠着奶奶，仰起头，指着天空数星星。一颗、两颗一直数到了几百颗奶奶笑着说：傻孩子，又在数星星了那么多星星，一闪一闪地乱动，眼睛都看花了，你能数得清吗孩子说：奶奶，能看得见，就能数得清。星星是在动，可不是乱动。您看，这颗星和那颗星，中间总是隔那么远爷爷走过来，说：孩子，你看得很仔细。天上的星星是在动，可是看起来它们之间的距离好像是不变的。我们的祖先把它们分成一组一组的，还给起了名字爷爷停了停，指着北边的天空，说：你看，那七颗星，连起来像一把勺子，叫北斗七星。勺口对着的那颗星，就是北极星。北斗七星总是绕着北极星转爷爷说的话是真的吗？这孩子一夜没睡好，几次起来看星星。他看清楚了，北斗七星果然是绕着北极星转动的这个数星星的孩子名叫张衡，是汉朝人。","sum":"张衡小时候靠着奶奶数星星，能数到几百颗，还发现星星不是乱动而是有组有距；长大后刻苦钻研天文，成了著名的天文学家。","ana":"由\"小时候\"写到\"长大以后\"，前后呼应。数星星的认真和爷爷讲星空知识的对话，埋下热爱科学的种子——兴趣加坚持才能成才。","quiz":[{"q":"数星星的孩子长大以后成了什么？","opts":["文学家","天文学家","画家"],"a":1},{"q":"这个孩子叫什么名字？","opts":["张衡","李时珍","牛顿"],"a":0}]},{"sec":"园地","no":"三","title":"语文园地三","ren":[{"z":"弹","p":"dàn"},{"z":"钢","p":"gāng"},{"z":"琴","p":"qín"},{"z":"捏","p":"niē"},{"z":"泥","p":"ní"},{"z":"围","p":"wéi"},{"z":"滚","p":"gǔn"},{"z":"铁","p":"tiě"},{"z":"环","p":"huán"},{"z":"滑","p":"huá"},{"z":"梯","p":"tī"}],"xie":[{"z":"图","p":"tú"},{"z":"泥","p":"ní"},{"z":"铁","p":"tiě"},{"z":"环","p":"huán"}],"words":[],"text":""},{"sec":"阅读","no":7,"title":"古诗二首（登鹳雀楼·望庐山瀑布）","ren":[{"z":"登","p":"dēng"},{"z":"唐","p":"táng"},{"z":"依","p":"yī"},{"z":"尽","p":"jǐn"},{"z":"欲","p":"yù"},{"z":"穷","p":"qióng"},{"z":"层","p":"céng"},{"z":"瀑","p":"pù"},{"z":"布","p":"bù"},{"z":"炉","p":"lú"},{"z":"紫","p":"zǐ"},{"z":"烟","p":"yān"},{"z":"遥","p":"yáo"}],"xie":[{"z":"依","p":"yī"},{"z":"尽","p":"jǐn"},{"z":"穷","p":"qióng"},{"z":"层","p":"céng"},{"z":"照","p":"zhào"},{"z":"炉","p":"lú"},{"z":"烟","p":"yān"},{"z":"川","p":"chuān"},{"z":"直","p":"zhí"},{"z":"银","p":"yín"}],"words":[],"text":"登鹳雀楼。唐，王之涣。白日依山尽，黄河入海流。欲穷千里目，更上一层楼。望庐山瀑布。唐，李白。日照香炉生紫烟，遥看瀑布挂前川。飞流直下三千尺，疑是银河落九天。","sum":"《登鹳雀楼》写登楼远望\"白日依山尽，黄河入海流\"，悟出\"欲穷千里目，更上一层楼\"；《望庐山瀑布》用\"飞流直下三千尺，疑是银河落九天\"夸瀑布雄伟。","ana":"两首唐人名作。前首寓理于景：想看得远就要站得高；后首夸张加想象，把瀑布比作银河。背诵时注意节奏：白日/依山/尽。","quiz":[{"q":"\"白日依山尽\"的下一句是？","opts":["黄河入海流","更上一层楼","飞流直下三千尺"],"a":0},{"q":"\"疑是银河落九天\"写的是什么？","opts":["彩虹","瀑布","大海"],"a":1}]},{"sec":"阅读","no":8,"title":"黄山奇石","ren":[{"z":"闻","p":"wén"},{"z":"景","p":"jǐng"},{"z":"区","p":"qū"},{"z":"省","p":"shěng"},{"z":"秀","p":"xiù"},{"z":"神","p":"shén"},{"z":"仙","p":"xiān"},{"z":"盘","p":"pán"},{"z":"指","p":"zhǐ"},{"z":"巨","p":"jù"},{"z":"伸","p":"shēn"},{"z":"都","p":"dōu"},{"z":"著","p":"zhù"},{"z":"抢","p":"qiǎng"},{"z":"状","p":"zhuàng"},{"z":"岩","p":"yán"}],"xie":[{"z":"仙","p":"xiān"},{"z":"顶","p":"dǐng"},{"z":"巨","p":"jù"},{"z":"位","p":"wèi"},{"z":"闪","p":"shǎn"},{"z":"狗","p":"gǒu"},{"z":"形","p":"xíng"},{"z":"状","p":"zhuàng"}],"words":["那些","山顶","山头","云海","仙人","前方","仙女"],"text":"中外闻名的黄山风景区在我国安徽省南部。那里景色秀丽神奇，尤其是那些怪石，有趣极了就说仙桃石吧，它好像从天上飞下来的一个大桃子，落在山顶的石盘上在一座陡峭的山峰上，有一只猴子。它两只胳膊抱着腿一动不动地蹲在山头，望着翻滚的云海。这就是有趣的猴子观海黄山奇石联系生活，我能猜出陡峭的意思。仙人指路就更有趣了！远远望去那巨石真像一位仙人站在高高的山峰上，伸着手臂指向前方每当太阳升起，有座山峰上的几块巨石，就变成了一只金光闪闪的雄鸡。它伸着脖子，对着天都峰不住地啼叫。不用说，这就是著名的金鸡叫天都了黄山的奇石还有很多，如天狗望月狮子抢球仙女弹琴。","sum":"黄山风景区景色秀丽神奇，\"仙桃石\"\"猴子观海\"\"仙人指路\"\"金鸡叫天都\"等怪石有趣极了。","ana":"总分总写景文。先总写\"那些怪石有趣极了\"，再一块块具体写，结尾感叹\"那些叫不出名字的奇形怪状的岩石……\"。\"好像\"\"真像\"把石头写活了。","quiz":[{"q":"\"仙桃石\"好像什么？","opts":["一个大桃子从天上飞下来落在石盘上","一只猴子","一只金鸡"],"a":0},{"q":"黄山奇石在哪个省？","opts":["安徽省","浙江省","四川省"],"a":0}]},{"sec":"阅读","no":9,"title":"日月潭","ren":[{"z":"潭","p":"tán"},{"z":"茂","p":"mào"},{"z":"盛","p":"shèng"},{"z":"胜","p":"shèng"},{"z":"央","p":"yāng"},{"z":"岛","p":"dǎo"},{"z":"隐","p":"yǐn"},{"z":"约","p":"yuē"},{"z":"倒","p":"dào"},{"z":"映","p":"yìng"},{"z":"整","p":"zhěng"},{"z":"童","p":"tóng"},{"z":"吸","p":"xī"},{"z":"引","p":"yǐn"},{"z":"客","p":"kè"}],"xie":[{"z":"湖","p":"hú"},{"z":"区","p":"qū"},{"z":"胜","p":"shèng"},{"z":"岛","p":"dǎo"},{"z":"弯","p":"wān"},{"z":"现","p":"xiàn"},{"z":"就","p":"jiù"},{"z":"外","p":"wài"}],"words":["山区","群山","树木","灯光","中午","眼前","细雨","风光","中外"],"text":"日月潭是我国台湾省最大的一个湖，它在台湾省中部的山区。那里群山环绕，树木茂盛，周围有许多名胜古迹日月潭很深，湖水碧绿。湖中央有个美丽的小岛，把湖水分成两半：北边像圆圆的太阳，叫日潭；南边像弯弯的月亮，叫月潭清晨，湖面上飘着薄薄的雾。天边的晨星和山上的点点灯光，隐隐约约地倒映在湖水中中午，太阳高照，整个日月潭的美景和周围的建筑，都清晰地展现在眼前。","sum":"日月潭是我国台湾省最大的湖，湖水碧绿，群山环绕；清晨薄雾像仙境，中午晴朗清晰，要是下起蒙蒙细雨，日月潭好像披上轻纱。","ana":"写景文。抓住\"清晨、中午、晴天、雨天\"不同时候的样子变换着写；\"隐隐约约\"\"朦胧\"等词勾画出仙境般的美。","quiz":[{"q":"日月潭在我国的哪个省？","opts":["广东省","台湾省","海南省"],"a":1},{"q":"下雨时的日月潭像什么？","opts":["披上轻纱","盖了棉被","戴上帽子"],"a":0}]},{"sec":"阅读","no":10,"title":"葡萄沟","ren":[{"z":"葡","p":"pú"},{"z":"萄","p":"táo"},{"z":"沟","p":"gōu"},{"z":"坡","p":"pō"},{"z":"密","p":"mì"},{"z":"枝","p":"zhī"},{"z":"淡","p":"dàn"},{"z":"好","p":"hǎo"},{"z":"族","p":"zú"},{"z":"够","p":"gòu"},{"z":"收","p":"shōu"},{"z":"市","p":"shì"},{"z":"干","p":"gàn"},{"z":"钉","p":"dīng"},{"z":"分","p":"fēn"},{"z":"颜","p":"yán"},{"z":"味","p":"wèi"}],"xie":[{"z":"份","p":"fèn"},{"z":"枝","p":"zhī"},{"z":"客","p":"kè"},{"z":"城","p":"chéng"},{"z":"市","p":"shì"},{"z":"孔","p":"kǒng"},{"z":"钉","p":"dīng"},{"z":"味","p":"wèi"}],"words":["地方","水果","月份","枝叶","五光十色","好客","老乡","有的","城市","空气","水分","这里","味道","有名"],"text":"新疆吐鲁番有个地方叫葡萄沟，那里盛产水果。五月有桑葚，六月有杏子、无花果到了七月份，人们最喜爱的葡萄成熟了葡萄种在山坡的梯田上。茂密的枝叶向四面展开，就像搭起了一个个绿色的凉棚葡萄一大串一大串地挂在绿叶底下，有红的、白的、紫的、淡绿的，五光十色，美丽极了。要是这时候你到葡萄沟去，热情好客的维吾尔族老乡，准会摘下最甜的葡萄，让你吃个够葡萄沟联系上文和生活，我知道了五光十色的意思。葡萄沟坡密枝淡好族够收市干钉分颜味收下来的葡萄，有的运到城市去，有的运到晾房里制成葡萄干。晾房修在山坡上四面墙上有许多小孔，里面钉着许多木架子。成串的葡萄挂在架子上，利用流动的热空气，让水分蒸发掉，就成了葡萄干。","sum":"新疆吐鲁番的葡萄沟盛产水果，五月的桑葚、六月的杏子、七月的葡萄最惹人爱；阴房里制成的葡萄干有名，老乡热情好客——葡萄沟真是个好地方！","ana":"总分总结构：先写水果多，再写葡萄长势和阴房制葡萄干，最后总结\"真是个好地方\"。\"绿色的凉棚\"比喻形象。","quiz":[{"q":"葡萄沟在我国哪个省区？","opts":["新疆吐鲁番","甘肃兰州","云南大理"],"a":0},{"q":"葡萄沟哪里最有名？","opts":["苹果","葡萄干","哈密瓜"],"a":1}]},{"sec":"园地","no":"四","title":"语文园地四","ren":[{"z":"订","p":"dìng"},{"z":"效","p":"xiào"},{"z":"丰","p":"fēng"},{"z":"昌","p":"chāng"},{"z":"付","p":"fù"},{"z":"卧","p":"wò"},{"z":"铺","p":"pù"},{"z":"改","p":"gǎi"},{"z":"签","p":"qiān"},{"z":"退","p":"tuì"},{"z":"更","p":"gèng"},{"z":"维","p":"wéi"},{"z":"码","p":"mǎ"}],"xie":[{"z":"号","p":"hào"},{"z":"丰","p":"fēng"}],"words":[],"text":""},{"sec":"阅读","no":11,"title":"坐井观天","ren":[{"z":"观","p":"guān"},{"z":"沿","p":"yán"},{"z":"渴","p":"kě"},{"z":"话","p":"huà"},{"z":"弄","p":"nòng"},{"z":"错","p":"cuò"},{"z":"际","p":"jì"},{"z":"抬","p":"tái"},{"z":"信","p":"xìn"}],"xie":[{"z":"观","p":"guān"},{"z":"呀","p":"ya"},{"z":"答","p":"dá"},{"z":"话","p":"huà"},{"z":"抬","p":"tái"},{"z":"能","p":"néng"},{"z":"信","p":"xìn"}],"words":["坐井观天","哪儿","回答","大话","不过","那么","抬头"],"text":"青蛙坐在井里。小鸟飞来，落在井沿上青蛙问小鸟你从哪儿来呀小鸟回答说我从天上来，飞了一百多里，口渴了，下来找点儿水喝青蛙说朋友，别说大话了！天不过井口那么大，还用飞那么远吗小鸟说你弄错了。天无边无际，大得很哪青蛙笑了，说朋友，我天天坐在井里一抬头就能看见天。","sum":"青蛙坐在井里说天只有井口那么大，小鸟说天无边无际大得很，俩人争了起来——不信就跳出井口来看一看。","ana":"寓言故事，全篇对话。\"井口那么大\"对\"无边无际\"，写出自以为是的可笑；告诉我们：看问题要眼界开阔，不能坐井观天。","quiz":[{"q":"青蛙认为天有多大？","opts":["无边无际","井口那么大","一万里"],"a":1},{"q":"这个故事告诉我们什么？","opts":["要跳出井口多看多想，别自以为是","小鸟爱吵架","井很深"],"a":0}]},{"sec":"阅读","no":12,"title":"寒号鸟","ren":[{"z":"号","p":"hào"},{"z":"当","p":"dāng"},{"z":"鹊","p":"què"},{"z":"寻","p":"xún"},{"z":"枯","p":"kū"},{"z":"却","p":"què"},{"z":"劝","p":"quàn"},{"z":"刮","p":"guā"},{"z":"死","p":"sǐ"},{"z":"将","p":"jiāng"},{"z":"且","p":"qiě"},{"z":"狂","p":"kuáng"},{"z":"冷","p":"lěng"},{"z":"重","p":"zhòng"},{"z":"复","p":"fù"},{"z":"哀","p":"āi"},{"z":"唤","p":"huàn"}],"xie":[{"z":"阵","p":"zhèn"},{"z":"做","p":"zuò"},{"z":"冻","p":"dòng"},{"z":"第","p":"dì"},{"z":"像","p":"xiàng"},{"z":"冷","p":"lěng"},{"z":"冰","p":"bīng"},{"z":"亮","p":"liàng"}],"words":["当作","前面","面对面","出去","过冬","知道","赶快","正好","明天","清早","好像","一样","天亮","出来"],"text":"山脚下有一堵石崖，崖上有一道缝，寒号鸟就把这道缝当作自己的窝。石崖前面有一条河，河边有一棵大杨树，杨树上住着喜鹊。寒号鸟和喜鹊面对面住着，成了邻居几阵秋风，树叶落尽，冬天快要到了有一天，天气晴朗。喜鹊一早飞出去东寻西找，衔回来一些枯草，就忙着做窝准备过冬。寒号鸟却只知道出去玩，累了就回来睡觉。喜鹊说寒号鸟，别睡了。天气暖和，赶快做窝寒号鸟不听劝告，躺在崖缝里对喜鹊说傻喜鹊，不要吵。太阳高照，正好睡觉寒号鸟本文是民间故事，选作课文时有改动。冬天说到就到，寒风呼呼地刮着。喜鹊住在温暖的窝里。寒号鸟在崖缝里冻得直打哆嗦，不停地叫着哆啰啰，哆啰啰，寒风冻死我，明天就做窝第二天清早，风停了，太阳暖暖的，好像又是春天了。喜鹊来到崖缝前劝寒号鸟趁天晴，快做窝。现在懒惰，将来难过寒号鸟还是不听劝告，伸伸懒腰，答道傻喜鹊，别啰唆。天气暖和，得过且过寒冬腊月，大雪纷飞。北风像狮子一样狂吼，崖缝里冷得像冰窖。寒号鸟重复着哀号哆啰啰，哆啰啰，寒风冻死我，明天就做窝天亮了，太阳出来了，喜鹊在枝头呼唤寒号鸟。可是，寒号鸟已经在夜里冻死了我在生活中也见过像喜鹊或寒号鸟这样的人。","sum":"喜鹊趁天晴忙着垒窝，寒号鸟却天天\"得过且过\"；寒冬一到，寒号鸟冻死在了岩缝里。","ana":"民间故事。两次\"冬天说到就到\"前后呼应，喜鹊的勤劳与寒号鸟的懒惰对比鲜明；\"得过且过\"是故事的关键词。","quiz":[{"q":"寒号鸟最后怎么样了？","opts":["搬了新家","冻死了","飞去南方"],"a":1},{"q":"喜鹊劝寒号鸟做什么？","opts":["趁天晴快垒窝","多睡觉","去找食物"],"a":0}]},{"sec":"阅读","no":13,"title":"我要的是葫芦","ren":[{"z":"葫","p":"hú"},{"z":"芦","p":"lú"},{"z":"谢","p":"xiè"},{"z":"以","p":"yǐ"},{"z":"盯","p":"dīng"},{"z":"赛","p":"sài"},{"z":"怪","p":"guài"},{"z":"慢","p":"màn"}],"xie":[{"z":"种","p":"zhǒng"},{"z":"棵","p":"kē"},{"z":"以","p":"yǐ"},{"z":"次","p":"cì"},{"z":"想","p":"xiǎng"},{"z":"邻","p":"lín"},{"z":"居","p":"jū"},{"z":"吧","p":"ba"},{"z":"奇","p":"qí"},{"z":"怪","p":"guài"}],"words":["从前","以后","多么","那个","叶子","虫子","自言自语","邻居","奇怪"],"text":"从前，有个人种了一棵葫芦。细长的葫芦藤上长满了绿叶，还开出了几朵雪白的小花。花谢以后，藤上挂了几个小葫芦多么可爱的小葫芦啊！那个人每天都要去看几次我要的是葫芦有一天，他看见叶子上爬着一些蚜虫心里想，有几个虫子怕什么！他盯着小葫芦自言自语地说我的小葫芦，快长啊，快长啊！长得赛过大南瓜才好呢一个邻居看见了，对他说你别光盯着葫芦了，叶子上生了蚜虫，快治一治吧那个人感到很奇怪，说什么？叶子上的虫还用治？我要的是葫芦没过几天，叶子上的蚜虫更多了。","sum":"种葫芦的人只想要葫芦，邻居劝他治叶子上的蚜虫他也不听，结果小葫芦一个个都落了。","ana":"寓言。开头\"多么可爱的小葫芦\"与结尾\"都落了\"对比强烈；那个人不懂叶子和葫芦的关系——做事要顾及联系，不能只盯着结果。","quiz":[{"q":"邻居劝那个人做什么？","opts":["快治蚜虫","多浇水","拔掉葫芦"],"a":0},{"q":"最后小葫芦怎么样了？","opts":["长得更大了","一个一个都落了","被卖掉了"],"a":1}]},{"sec":"园地","no":"五","title":"语文园地五","ren":[{"z":"轿","p":"jiào"},{"z":"救","p":"jiù"},{"z":"摩","p":"mó"},{"z":"托","p":"tuō"},{"z":"防","p":"fáng"},{"z":"渔","p":"yú"},{"z":"货","p":"huò"},{"z":"科","p":"kē"},{"z":"考","p":"kǎo"},{"z":"察","p":"chá"}],"xie":[{"z":"货","p":"huò"},{"z":"科","p":"kē"}],"words":[],"text":""},{"sec":"阅读","no":14,"title":"八角楼上","ren":[{"z":"楼","p":"lóu"},{"z":"艰","p":"jiān"},{"z":"斗","p":"dòu"},{"z":"代","p":"dài"},{"z":"临","p":"lín"},{"z":"腊","p":"là"},{"z":"军","p":"jūn"},{"z":"薄","p":"báo"},{"z":"章","p":"zhāng"},{"z":"握","p":"wò"},{"z":"凝","p":"níng"},{"z":"觉","p":"jué"},{"z":"油","p":"yóu"},{"z":"辉","p":"huī"},{"z":"革","p":"gé"},{"z":"命","p":"mìng"},{"z":"利","p":"lì"}],"xie":[{"z":"楼","p":"lóu"},{"z":"代","p":"dài"},{"z":"穿","p":"chuān"},{"z":"视","p":"shì"},{"z":"利","p":"lì"},{"z":"路","p":"lù"}],"words":["年代","更加","明亮","星星之火","中国","胜利","道路"],"text":"在井冈山艰苦斗争的年代，毛主席住在茅坪村的八角楼。每当夜幕降临的时候，八角楼上的灯就亮了这是个寒冬腊月的深夜，毛主席穿着单军衣，披着薄毯子，坐在竹椅上写文章。他右手握着笔，左手轻轻地拨了拨灯芯，灯光八角楼上本文选自人民教育出版社《全日制十年制学校小学课本（试用本）语文第五册》。","sum":"寒冬深夜，毛主席在井冈山茅坪村的八角楼上，点着清油灯写文章，灯芯拨了又拨，灯光照亮了中国革命的道路。","ana":"革命领袖题材。细节描写传神：\"右手握着笔，左手轻轻地拨了拨灯芯\"；\"点燃的灯\"象征着指引方向的革命思想。","quiz":[{"q":"毛主席是在哪里写文章的？","opts":["八角楼上","窑洞里","船上"],"a":0},{"q":"八角楼上的灯亮着，说明毛主席在做什么？","opts":["睡觉","连夜工作写文章","做饭"],"a":1}]},{"sec":"阅读","no":15,"title":"朱德的扁担","ren":[{"z":"朱","p":"zhū"},{"z":"德","p":"dé"},{"z":"扁","p":"biǎn"},{"z":"担","p":"dān"},{"z":"同","p":"tóng"},{"z":"志","p":"zhì"},{"z":"伍","p":"wǔ"},{"z":"敌","p":"dí"},{"z":"根","p":"gēn"},{"z":"据","p":"jù"},{"z":"抽","p":"chōu"},{"z":"陡","p":"dǒu"},{"z":"鞋","p":"xié"},{"z":"疼","p":"téng"},{"z":"敬","p":"jìng"}],"xie":[{"z":"同","p":"tóng"},{"z":"志","p":"zhì"},{"z":"军","p":"jūn"},{"z":"敌","p":"dí"},{"z":"常","p":"cháng"},{"z":"非","p":"fēi"},{"z":"每","p":"měi"},{"z":"战","p":"zhàn"},{"z":"士","p":"shì"},{"z":"戴","p":"dài"}],"words":["同志","红军","敌人","生产","常常","来回","非常","战士","一块儿","白天"],"text":"1928年，朱德同志带领队伍到井冈山跟毛泽东同志带领的队伍会师了。红军在山上，山下不远处就是敌人红军要巩固井冈山根据地，粉碎敌人的围攻，需要储备足够的粮食。井冈山上生产的粮食不多，常常要抽出一些人到山下宁冈的茅坪去挑粮。从井冈山到茅坪，来回有五六十里，山高路陡，非常难走。可是每次挑粮，大家都争着去朱德同志也跟战士们一块儿去挑粮。他穿着草鞋，戴着斗笠，挑起粮食，跟大家一块儿爬山。白天挑粮爬山，晚上还常常整朱德的扁担夜整夜地研究怎样跟敌人打仗。大家看了心疼，就把他那根扁担藏了起来。","sum":"红军上山储备粮食，朱德同志也跟战士们一起挑粮；战士们心疼他把扁担藏起来，他又找来一根，写上\"朱德的扁担\"。","ana":"\"藏扁担—找扁担—写名字\"，情节一波三折。从\"大家看了越发敬爱朱德同志\"看出领袖与战士同甘共苦。","quiz":[{"q":"战士们为什么藏朱德的扁担？","opts":["怕他累着","不喜欢他","扁担坏了"],"a":0},{"q":"朱德在新扁担上写了什么？","opts":["朱德的扁担","加油","不要藏"],"a":0}]},{"sec":"阅读","no":16,"title":"难忘的泼水节","ren":[{"z":"泼","p":"pō"},{"z":"民","p":"mín"},{"z":"度","p":"dù"},{"z":"特","p":"tè"},{"z":"周","p":"zhōu"},{"z":"恩","p":"ēn"},{"z":"敲","p":"qiāo"},{"z":"铺","p":"pù"},{"z":"龙","p":"lóng"},{"z":"串","p":"chuàn"},{"z":"容","p":"róng"},{"z":"踩","p":"cǎi"},{"z":"始","p":"shǐ"},{"z":"盛","p":"shèng"},{"z":"碗","p":"wǎn"},{"z":"祝","p":"zhù"},{"z":"寿","p":"shòu"}],"xie":[{"z":"难","p":"nán"},{"z":"忘","p":"wàng"},{"z":"民","p":"mín"},{"z":"因","p":"yīn"},{"z":"理","p":"lǐ"},{"z":"串","p":"chuàn"},{"z":"裤","p":"kù"},{"z":"令","p":"lìng"}],"words":["难忘","火红","人民","因为","总理","人们","四面八方","为了","人群","欢乐","开心"],"text":"火红火红的凤凰花开了，傣族人民一年一度的泼水节又到了1961年的泼水节，傣族人民特别高兴因为敬爱的周恩来总理和他们一起过泼水节那天早晨，人们敲起象脚鼓，从四面八方赶来了。为了欢迎周总理，人们在地上撒满了凤凰花的花瓣，好像铺上了鲜红的地毯。一条条龙船驶过江面，一串串花炮升上天空。人们欢呼着周总理来了周总理身穿对襟白褂、咖啡色长裤，头上包着一条水红色头巾，笑容满面地来到人群中。他接过一面象脚鼓，敲起欢乐的鼓难忘的泼水节点，踩着凤凰花铺成的地毯，同傣族人民一起跳舞开始泼水了。周总理一手端着盛满清水的银碗，一手拿着柏树枝蘸了水，向人们泼洒，为人们祝福。傣族人民一边欢呼，一边向周总理泼水，祝福他健康长寿清清的水，泼啊，洒啊！","sum":"1961年泼水节，敬爱的周总理来到傣族村寨，穿着傣家装束，端着银碗泼水祝福，和人民一起跳舞欢庆。","ana":"\"火红火红的凤凰花\"\"一年一度\"渲染喜庆；周总理换上傣家装束、用柏树枝蘸水祝福，处处体现总理和人民心连心，所以\"多么难忘\"。","quiz":[{"q":"周总理用什么泼水祝福大家？","opts":["银碗和柏树枝","水枪","脸盆"],"a":0},{"q":"为什么这个泼水节令人难忘？","opts":["凤凰花特别红","周总理和大家一起过节","下了一场雨"],"a":1}]},{"sec":"阅读","no":17,"title":"刘胡兰","ren":[{"z":"刘","p":"liú"},{"z":"兰","p":"lán"},{"z":"派","p":"pài"},{"z":"由","p":"yóu"},{"z":"于","p":"yú"},{"z":"卖","p":"mài"},{"z":"员","p":"yuán"},{"z":"捕","p":"bǔ"},{"z":"买","p":"mǎi"},{"z":"似","p":"shì"},{"z":"踏","p":"tà"},{"z":"烈","p":"liè"},{"z":"荣","p":"róng"},{"z":"岁","p":"suì"},{"z":"题","p":"tí"}],"xie":[{"z":"反","p":"fǎn"},{"z":"村","p":"cūn"},{"z":"由","p":"yóu"},{"z":"于","p":"yú"},{"z":"员","p":"yuán"},{"z":"被","p":"bèi"},{"z":"声","p":"shēng"},{"z":"岁","p":"suì"},{"z":"消","p":"xiāo"},{"z":"息","p":"xī"}],"words":["由于","年轻","共产党员","共产党","现在","一点儿","消息"],"text":"1947年1月12日，天阴沉沉的，国民党反动派包围了云周西村。由于叛徒的出卖年轻的共产党员刘胡兰被捕了，关在一座庙里敌人问刘胡兰现在有人供出你是共产党员！你们村里还有谁是刘胡兰回答就我一个敌人想收买刘胡兰，对她说说出来，就给你一份地刘胡兰大声回答给我一个金人，我也不说敌人又威胁她说不说就打死你刘胡兰愤怒地回答打死也不说刘胡兰像钢铁铸成似的刘胡兰一点儿也不动摇敌人把刘胡兰拉到庙门口的广场上当着她和乡亲们的面，铡死了被捕的六名革命群众。敌人指着血淋淋的铡刀说再不说，也铡死你刘胡兰挺起胸膛说要杀要砍由你们，怕死不当共产党她迎着呼呼的北风，踏着烈士的鲜血，走到铡刀前。","sum":"1947年1月12日，刘胡兰被捕。面对敌人的收买和威胁，她坚贞不屈，最后壮烈牺牲，毛主席为她题词\"生的伟大，死的光荣\"。","ana":"革命英雄故事。敌人\"收买—威胁—毒打—杀害\"层层加码，反衬出刘胡兰的坚定；\"就我一个！\"简短有力，掷地有声。","quiz":[{"q":"毛主席给刘胡兰的题词是什么？","opts":["生的伟大，死的光荣","人民英雄永垂不朽","好好学习"],"a":0},{"q":"面对敌人的收买，刘胡兰是怎么做的？","opts":["说出秘密","坚贞不屈","求饶"],"a":1}]},{"sec":"园地","no":"六","title":"语文园地六","ren":[{"z":"锋","p":"fēng"},{"z":"蜜","p":"mì"},{"z":"峰","p":"fēng"},{"z":"蜂","p":"fēng"},{"z":"爆","p":"bào"},{"z":"争","p":"zhēng"},{"z":"抄","p":"chāo"},{"z":"炒","p":"chǎo"},{"z":"幕","p":"mù"},{"z":"墓","p":"mù"},{"z":"慕","p":"mù"}],"xie":[{"z":"抄","p":"chāo"},{"z":"炒","p":"chǎo"}],"words":[],"text":""},{"sec":"阅读","no":18,"title":"古诗二首（江雪·敕勒歌）","ren":[{"z":"绝","p":"jué"},{"z":"径","p":"jìng"},{"z":"踪","p":"zōng"},{"z":"灭","p":"miè"},{"z":"舟","p":"zhōu"},{"z":"钓","p":"diào"},{"z":"似","p":"shì"},{"z":"庐","p":"lú"},{"z":"笼","p":"lóng"},{"z":"盖","p":"gài"},{"z":"苍","p":"cāng"},{"z":"茫","p":"máng"}],"xie":[{"z":"绝","p":"jué"},{"z":"灭","p":"miè"},{"z":"舟","p":"zhōu"},{"z":"独","p":"dú"},{"z":"阴","p":"yīn"},{"z":"似","p":"shì"},{"z":"野","p":"yě"},{"z":"低","p":"dī"}],"words":[],"text":"江雪。唐，柳宗元。千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。敕勒歌。北朝民歌。敕勒川，阴山下。天似穹庐，笼盖四野。天苍苍，野茫茫，风吹草低见牛羊。","sum":"《江雪》写大雪封江，只有一位老翁孤舟独钓寒江雪；《敕勒歌》唱阴山下的草原：\"天苍苍，野茫茫，风吹草低见牛羊。\"","ana":"两首古诗一冷一阔。《江雪》前两句写景后两句写人，孤傲安静；《敕勒歌》是北朝民歌，雄浑壮阔，\"风吹草低见牛羊\"是千古名句。","quiz":[{"q":"\"独钓寒江雪\"里的老翁在做什么？","opts":["钓鱼","堆雪人","划船"],"a":0},{"q":"\"风吹草低\"之后看见了什么？","opts":["牛羊","马群","房屋"],"a":0}]},{"sec":"阅读","no":19,"title":"雾在哪里","ren":[{"z":"论","p":"lùn"},{"z":"暗","p":"àn"},{"z":"岸","p":"àn"},{"z":"街","p":"jiē"},{"z":"梁","p":"liáng"},{"z":"甚","p":"shèn"},{"z":"至","p":"zhì"},{"z":"切","p":"qiè"},{"z":"躲","p":"duǒ"},{"z":"该","p":"gāi"},{"z":"悠","p":"yōu"},{"z":"闲","p":"xián"},{"z":"散","p":"sàn"},{"z":"失","p":"shī"}],"xie":[{"z":"论","p":"lùn"},{"z":"船","p":"chuán"},{"z":"猫","p":"māo"},{"z":"切","p":"qiè"},{"z":"该","p":"gāi"},{"z":"散","p":"sàn"},{"z":"步","p":"bù"},{"z":"失","p":"shī"}],"words":["于是","无论","船只","同时","行人","一切","上空","看来","不久","路上","出现","散步","消失"],"text":"从前有一片雾，他是个淘气的孩子有一天，雾飞到海上我要把大海藏起来于是，他把大海藏了起来。无论是海水、船只，还是蓝色的远方，都看不见了现在我要把天空连同太阳一起藏起来于是，他把天空连同太阳一起藏了起来。霎时，四周变暗了，无论是天空，还是天空中的太阳，都看不见了雾来到岸边雾在哪里现在我要把海岸藏起来雾把海岸藏了起来，同时也把城市藏了起来。房屋、街道、树木、桥梁甚至行人和小黑猫，雾把一切都藏了起来，什么都看不见了他躲到城市的上空，说道现在，我该把谁藏起来呢看来，再也没有可藏的了我要把自己藏起来不久，大海连同船只，天空连同太阳，海岸连同城市，街道连同房屋和桥梁，都露出来了。","sum":"淘气的雾把大海、天空、太阳、海岸都藏了起来，最后把自己也藏了起来——一切都露出来了。","ana":"拟人童话。三次\"我要把……藏起来\"句式反复，\"无论是海水、船只，还是蓝色的远方，都看不见了\"是重点句式，读起来有趣又有节奏。","quiz":[{"q":"雾是一个怎样的孩子？","opts":["淘气的","胆小的","勤奋的"],"a":0},{"q":"最后雾把自己藏起来，发生了什么？","opts":["什么都没有了","大海和天空都露了出来","天黑了"],"a":1}]},{"sec":"阅读","no":20,"title":"雪孩子","ren":[{"z":"堆","p":"duī"},{"z":"累","p":"lèi"},{"z":"添","p":"tiān"},{"z":"柴","p":"chái"},{"z":"烧","p":"shāo"},{"z":"旺","p":"wàng"},{"z":"闭","p":"bì"},{"z":"哎","p":"āi"},{"z":"旁","p":"páng"},{"z":"冲","p":"chōng"},{"z":"哇","p":"wa"},{"z":"终","p":"zhōng"},{"z":"浑","p":"hún"},{"z":"淋","p":"lín"},{"z":"晒","p":"shài"}],"xie":[{"z":"要","p":"yào"},{"z":"伙","p":"huǒ"},{"z":"伴","p":"bàn"},{"z":"歌","p":"gē"},{"z":"得","p":"dé"},{"z":"闭","p":"bì"},{"z":"忙","p":"máng"},{"z":"谁","p":"shuí"},{"z":"汽","p":"qì"}],"words":["空地","伙伴","唱歌","回家","一会儿","着火","火星","一边","连忙","树林","水汽","白云"],"text":"雪，下个不停，一连下了好几天这天早上，天晴了，兔妈妈要出门去小白兔嚷起来妈妈，妈妈，我也要去兔妈妈说好孩子，妈妈有事，你不能跟着去兔妈妈在门外的空地上给小白兔堆了个雪孩子。小白兔有了小伙伴，就不跟妈妈去了雪孩子小白兔跳舞给雪孩子看，唱歌给雪孩子听。他玩累了，就回家去睡午觉屋子里真冷，赶快往火堆里添把柴吧小白兔添了柴，把火烧得旺旺的，屋子里渐渐暖和了。他躺在床上，闭上眼睛，一会儿就睡着了火越烧越旺。哎呀，火把旁边的柴堆烧着了！小白兔睡得正香，他一点儿也不知道不好了！小白兔家着火了雪孩子看见从小白兔家的窗户里冒出黑烟，蹿出火星。他一边喊，一边向小白兔家跑去小白兔，小白兔！你在哪里雪孩子冲进屋里，冒着呛人的烟、烫人的火，找哇找哇，终于找到了小白兔。他连忙把小白兔抱起来，跑到屋外小白兔得救了，雪孩子却浑身水淋淋的这时候，树林里的小猴子、小山羊都赶来救火了。不一会儿，大家就把火扑灭了兔妈妈回来了，激动地说谢谢大家来救火，救了小白兔，谢谢大家咦，是谁救了小白兔小动物们说真得谢谢他呢这时，救小白兔的雪孩子不见了。他已经化成水了不，雪孩子还在呢！瞧，太阳晒着晒着他变成了很轻很轻的水汽。","sum":"兔妈妈堆了个雪孩子陪小白兔。小白兔睡觉时火星点着了柴堆，雪孩子冲进火里救出小白兔，自己化成水汽，飞上天空变成了一朵美丽的白云。","ana":"想象丰富的童话。救火一段\"雪孩子浑身水淋淋\"最感人；结尾化作白云把生命延续写得又美又暖——善良和勇敢不会消失。","quiz":[{"q":"雪孩子冲进火海是为了什么？","opts":["救小白兔","抢柴火","取暖"],"a":0},{"q":"雪孩子最后变成了什么？","opts":["一朵白云","一滴雨水","一片雪花"],"a":0}]},{"sec":"园地","no":"七","title":"语文园地七","ren":[{"z":"漱","p":"shù"},{"z":"饿","p":"è"},{"z":"沼","p":"zhǎo"},{"z":"泽","p":"zé"},{"z":"宁","p":"níng"},{"z":"杠","p":"gāng"},{"z":"杆","p":"gān"},{"z":"栋","p":"dòng"},{"z":"库","p":"kù"},{"z":"闸","p":"zhá"},{"z":"羔","p":"gāo"},{"z":"蝗","p":"huáng"}],"xie":[{"z":"饥","p":"jī"},{"z":"饿","p":"è"},{"z":"宁","p":"níng"},{"z":"库","p":"kù"}],"words":[],"text":""},{"sec":"阅读","no":21,"title":"称赞","ren":[{"z":"称","p":"chēng"},{"z":"赞","p":"zàn"},{"z":"刺","p":"cì"},{"z":"猬","p":"wèi"},{"z":"板","p":"bǎn"},{"z":"凳","p":"dèng"},{"z":"但","p":"dàn"},{"z":"极","p":"jí"},{"z":"傍","p":"bàng"},{"z":"苹","p":"píng"},{"z":"泄","p":"xiè"},{"z":"接","p":"jiē"},{"z":"除","p":"chú"},{"z":"疲","p":"pí"},{"z":"劳","p":"láo"}],"xie":[{"z":"拿","p":"ná"},{"z":"仔","p":"zǎi"},{"z":"极","p":"jí"},{"z":"送","p":"sòng"},{"z":"椅","p":"yǐ"},{"z":"怎","p":"zěn"},{"z":"拉","p":"lā"},{"z":"收","p":"shōu"},{"z":"接","p":"jiē"}],"words":["果子","木工","身边","仔细","能干","椅子","怎么","自信","从来","这么"],"text":"小刺猬去森林里采果子。在小路边，他看见一只小獾在学做木工。小獾已经做成了三个小板凳。板凳做得很粗糙，但是看得出，他做得很认真小刺猬走到小獾身边，拿起板凳仔细地看了看。他对小獾说你真能干，小板凳做得一个比一个好真的吗小獾高兴极了傍晚，小刺猬抱着几个红红的大苹果往家里走小獾见小刺猬来了，高兴地迎上去。他送给小刺猬一把椅子，小刺猬不好意思地说我怎么能要你的椅子呢？我可没干什么呀小獾拉着小刺猬的手，说在我有点儿泄气的时候，是你称赞了我，让我有了自信瞧，我已经会做椅子了。","sum":"小刺猬真诚地称赞小獾的板凳\"一个比一个好\"，小獾有了自信；小獾也称赞小刺猬的苹果香甜，两人都收获了快乐。","ana":"童话，主题是\"称赞\"的力量。板凳\"很粗糙\"却\"一个比一个好\"，称赞是看到别人的进步；一句真诚的夸奖能给人自信。","quiz":[{"q":"小刺猬称赞小獾的板凳怎么样？","opts":["一个比一个好","很粗糙","最难看"],"a":0},{"q":"小獾送给小刺猬什么？","opts":["一把苹果","板凳","鲜花"],"a":0}]},{"sec":"阅读","no":22,"title":"纸船和风筝","ren":[{"z":"筝","p":"zhēng"},{"z":"鼠","p":"shǔ"},{"z":"折","p":"zhé"},{"z":"漂","p":"piāo"},{"z":"扎","p":"zhā"},{"z":"乘","p":"chéng"},{"z":"抓","p":"zhuā"},{"z":"线","p":"xiàn"},{"z":"莓","p":"méi"},{"z":"俩","p":"liǎ"},{"z":"架","p":"jià"},{"z":"受","p":"shòu"},{"z":"愿","p":"yuàn"},{"z":"朝","p":"cháo"},{"z":"取","p":"qǔ"}],"xie":[{"z":"纸","p":"zhǐ"},{"z":"抓","p":"zhuā"},{"z":"线","p":"xiàn"},{"z":"吵","p":"chǎo"},{"z":"但","p":"dàn"},{"z":"受","p":"shòu"},{"z":"句","p":"jù"},{"z":"哭","p":"kū"}],"words":["上面","快乐","可是","难过","但是","和好"],"text":"松鼠和小熊住在一座山上。松鼠住在山顶，小熊住在山脚。山上的小溪往下流，正好从小熊的家门口流过。松鼠折了一只纸船，放在小溪里。纸船漂哇漂，漂到了小熊家门口。小熊拿起纸船一看，乐坏了。纸船里放着一个小松果，松果上挂着一张纸条，上面写着：祝你快乐！小熊也想折一只纸船送给松鼠，可是纸船不能漂到山上去。怎么办呢？他想了想，就扎了一只风筝。风筝乘着风，飘哇飘，飘到了松鼠家门口。松鼠一把抓住风筝的线一看，也乐坏了。风筝上挂着一个草莓，风筝的翅膀上写着：祝你幸福！纸船和风筝纸船和风筝让他们俩成了好朋友。可是有一天，他们俩为了一点儿小事吵了一架。山顶上再也看不到飘荡的风筝，小溪里再也看不到漂流的纸船了。小熊很难过。他还是每天扎一只风筝，但是不好意思把风筝放起来，就把风筝挂在高高的树枝上。松鼠也很难过。他还是每天折一只纸船，他也不好意思把纸船放进小溪，就把纸船放到屋顶上。过了几天，松鼠再也受不了啦。他在一只折好的纸船上写了一句话：如果你愿意和好，就放一只风筝吧！他把这只纸船放进了小溪。傍晚，松鼠看见一只只美丽的风筝朝他飞来，高兴得哭了。他连忙爬上屋顶，取下纸船，把一只只纸船放到了小溪里。","sum":"松鼠和小熊用纸船和风筝传递问候，成了好朋友；吵了一架后，两人又用纸船和风筝主动和好。","ana":"童话。纸船和风筝是友谊的纽带：\"祝你快乐！\"\"祝你幸福！\"传递心意；吵架后\"他还是每天扎一只风筝\"的心理描写最动人——珍惜友谊要主动。","quiz":[{"q":"纸船和风筝在故事里起什么作用？","opts":["传递问候和祝福","玩具","装食物"],"a":0},{"q":"吵架之后他们俩最后怎样了？","opts":["再也不理对方","和好如初","搬走了"],"a":1}]},{"sec":"阅读","no":23,"title":"快乐的小河","ren":[{"z":"撞","p":"zhuàng"},{"z":"怨","p":"yuàn"},{"z":"软","p":"ruǎn"},{"z":"呜","p":"wū"},{"z":"慈","p":"cí"},{"z":"祥","p":"xiáng"},{"z":"量","p":"liàng"},{"z":"跌","p":"diē"},{"z":"摔","p":"shuāi"},{"z":"擦","p":"cā"},{"z":"咱","p":"zán"},{"z":"推","p":"tuī"},{"z":"驶","p":"shǐ"},{"z":"坚","p":"jiān"},{"z":"硬","p":"yìng"}],"xie":[{"z":"游","p":"yóu"},{"z":"戏","p":"xì"},{"z":"爱","p":"ài"},{"z":"呢","p":"ne"},{"z":"跳","p":"tiào"},{"z":"咱","p":"zán"}],"words":["眼泪","水花","青草","游戏","只有","可爱","可以","多少","咱们","田野","大地","远方","（共239个词）"],"text":"一条小河唱着歌向前流着，他太着急了，迎面撞在一座大山上。撞得我好疼啊！小河流出眼泪，扬起一片水花。他抱怨说：我流过松软的沙土，流过滑溜的泥地，野花为我唱歌，青草跟我游戏，大家都跟我好。只有你，又高又大的山，撞疼了我，呜呜呜……大山笑了，慈祥地说：别哭了，可爱的小河。听我对你讲，不平静的水才有力量，跌几个跟头怕什么？这可以让你更有劲儿呢！你看这山里的泉水，从山上跳下来，一路上摔了多少跟头啊，可是他唱着快乐的歌，勇敢地向前奔跑，从来不叫苦。小河擦了擦眼泪，告别大山，来到泉水旁边。他对泉水说：咱们做好朋友吧！手拉着手，一块儿向前流。泉水说：好啊！请你带我流向很远很远的地方。流过田野，给大地穿上美丽的衣裳；流进大海，推着船儿驶向前方……小河说：你真勇敢！泉水说：瀑布比我更勇敢。你看，他从那么高的山顶上跳下来，一点儿也不怕，还大声地笑着，叫着，把坚硬的石头冲刷得那么光滑。小河高兴地冲着瀑布喊道：勇敢的瀑布，咱们做好朋友吧！手拉着手，一块儿向前流。瀑布高兴地回答：好啊，好啊！三个好伙伴，手拉着手，蹦啊，跳啊，溅起一片片水花，一起流向远方。","sum":"小河一路唱着歌，却撞疼了山、拦了石头，他气馁过；在大家的鼓励下他绕过巨石、跃下悬崖，终于明白：奔向大海的路上，克服困难就是快乐。","ana":"拟人童话。开头\"唱着歌\"与结尾\"又唱起歌来\"首尾呼应；一路上\"疼—抱怨—勇敢—快乐\"的心理变化写得真切，告诉我们成长要不怕困难。","quiz":[{"q":"小河一开始为什么难过？","opts":["撞疼在大山上还被石头拦路","没有朋友","迷路了"],"a":0},{"q":"小河最后明白了什么？","opts":["克服困难向前流就是快乐","大海太远了","石头最讨厌"],"a":0}]},{"sec":"园地","no":"八","title":"语文园地八","ren":[{"z":"狼","p":"láng"},{"z":"猩","p":"xīng"},{"z":"鹤","p":"hè"},{"z":"蛇","p":"shé"},{"z":"鸽","p":"gē"},{"z":"蚕","p":"cán"},{"z":"蚯","p":"qiū"},{"z":"蚓","p":"yǐn"},{"z":"骆","p":"luò"},{"z":"驼","p":"tuó"},{"z":"狮","p":"shī"}],"xie":[{"z":"狼","p":"láng"},{"z":"蛇","p":"shé"}],"words":[],"text":""}],"poems":[{"title":"登鹳雀楼","author":"唐·王之涣","lines":["白日依山尽，","黄河入海流。","欲穷千里目，","更上一层楼。"]},{"title":"望庐山瀑布","author":"唐·李白","lines":["日照香炉生紫烟，","遥看瀑布挂前川。","飞流直下三千尺，","疑是银河落九天。"]},{"title":"江雪","author":"唐·柳宗元","lines":["千山鸟飞绝，","万径人踪灭。","孤舟蓑笠翁，","独钓寒江雪。"]},{"title":"敕勒歌","author":"北朝民歌","lines":["敕勒川，阴山下。","天似穹庐，","笼盖四野。","天苍苍，野茫茫，","风吹草低见牛羊。"]}]};

  localStorage.setItem(KEY,JSON.stringify(rec));
}
function isDone(l){ const r=loadRec()[fmtKey(new Date())]; return !!r; } // 今日已答题则全部标亮（简化）
const $ = function(id){ return document.getElementById(id); };
const lid=(l)=>l.sec+l.no;

/* ================= 朗读 TTS ================= */
function speak(txt){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='zh-CN'; u.rate=0.82;
    const vs=speechSynthesis.getVoices().filter(v=>v.lang.indexOf('zh')===0);
    if(vs.length) u.voice=vs[0];
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= 课文列表 ================= */
function renderCourse(){
  const rec=loadRec(), today=fmtKey(new Date());
  let html='';
  UNITS.forEach(u=>{
    html+=`<div class="unit-title">${u.t}</div><div class="lesson-grid">`;
    u.ids.forEach(id=>{
      const l=LESSONS.find(x=>lid(x)===id);
      const done = rec[today] ? ' <span class="st done">✓今日已练</span>' : '';
      html+=`<div class="lesson" onclick="openLesson('${id}')">
        <div class="no">${l.sec==='识字'?'识字':'课文'} ${l.no}</div>
        <div class="nm">${l.title.length>8?l.title.slice(0,8)+'…':l.title}</div>
        ${done}</div>`;
    });
    html+='</div>';
  });
  $('v-course').innerHTML=html;
}
function openLesson(id){
  const l=LESSONS.find(x=>lid(x)===id);
  let html=`<button class="btn small back" onclick="showTab('course')">◀ 回课文列表</button>
    <div class="card">
      <div class="detail-head">
        <h2>${l.sec==='识字'?'识字':'课文'}${l.no} · ${l.title}</h2>
        <button class="btn small mint" onclick="speakLesson('${id}')">🔊 朗读课文</button>
      </div>
      <div class="sum-box"><b>📌 课文摘要</b>${l.sum}</div>
      <div class="ana-box"><b>💡 课文解析</b>${l.ana}</div>
      <div class="chip-title">👀 会认字（${l.ren.length}个，点一点听读音）</div>
      <div class="chips">${l.ren.map(c=>`<div class="chip" onclick="speak('${c.z}')"><span class="z">${c.z}</span><span class="p">${c.p}</span></div>`).join('')}</div>
      <div class="chip-title">✍️ 会写字（${l.xie.length}个）</div>
      <div class="chips">${l.xie.map(c=>`<div class="chip xie" onclick="speak('${c.z}')"><span class="z">${c.z}</span><span class="p">${c.p}</span></div>`).join('')}</div>
      ${l.words.length?`<div class="chip-title">📝 词语表（点一点跟读）</div>
      <div class="chips">${l.words.map(w=>`<div class="chip w" onclick="speak('${w}')"><span class="z" style="font-size:13px">${w}</span></div>`).join('')}</div>`:''}
    </div>`;
  $('v-detail').innerHTML=html;
  showTab('detail');
}
function tn(l){ return l.title.replace(/（.*?）/,'')+'。'+l.text; }
function speakLesson(id){ const l=LESSONS.find(x=>lid(x)===id); speak(tn(l)); }

/* ================= 生字卡 ================= */
let cards=[], ci=0;
function buildCards(secNo){
  cards=[];
  LESSONS.filter(l=>!secNo||lid(l)===secNo).forEach(l=>{
    l.ren.forEach(c=>{
      const wds=l.words.filter(w=>w.includes(c.z)).slice(0,3);
      cards.push({...c, w:wds.join('、'), from:l.title});
    });
    l.xie.forEach(c=>{
      if(!cards.some(x=>x.z===c.z&&x.from===l.title)){
        const wds=l.words.filter(w=>w.includes(c.z)).slice(0,3);
        cards.push({...c, w:wds.join('、'), from:l.title, xie:true});
      }
    });
  });
  ci=0; renderCard();
}
function renderCard(){
  if(!cards.length){ $('v-cards').innerHTML='<div class="card center">没有生字</div>'; return; }
  const c=cards[ci];
  const selOpts = ['<button class="btn small '+(cardFilter===''?'on':'')+'" onclick="cardFilter=\'\';buildCards(\'\')">全部</button>']
    .concat(LESSONS.map(l=>`<button class="btn small ${cardFilter===lid(l)?'on':''}" onclick="cardFilter='${lid(l)}';buildCards('${lid(l)}')">${l.sec==='识字'?'识':'课'}${l.no}</button>`)).join('');
  $('v-cards').innerHTML=`
    <div class="card">
      <div class="filter-row">${selOpts}</div>
      <div class="flash-wrap">
        <div class="flash" onclick="flipCard(this)">
          <span class="idx">${ci+1} / ${cards.length}</span>
          <span class="hint">点卡片翻面</span>
          <span class="py">${c.p}</span>
          <span class="big">${c.z}</span>
          <span class="wds">${c.w?('组词：'+c.w):''}</span>
        </div>
        <div class="flash-nav">
          <button class="btn" onclick="prevCard()">◀ 上一个</button>
          <button class="btn mint" onclick="speak('${c.z}')">🔊 读一读</button>
          <button class="btn" onclick="nextCard()">下一个 ▶</button>
        </div>
      </div>
    </div>`;
}
function flipCard(el){ speak(cards[ci].z); }
function prevCard(){ ci=(ci-1+cards.length)%cards.length; renderCard(); }
function nextCard(){ ci=(ci+1)%cards.length; renderCard(); }
let cardFilter='';

/* ================= 古诗 ================= */
function renderPoems(){
  $('v-poem').innerHTML = POEMS.map((p,i)=>`
    <div class="card">
      <div class="poem-head"><h3>${p.title}</h3><span class="au">${p.author}</span></div>
      <div>${p.lines.map(ln=>`<div class="poem-line" onclick="speak('${ln.replace(/[，。]/g,'')}')">${ln}</div>`).join('')}</div>
      <div style="margin-top:10px"><button class="btn small pink" onclick="speak(POEMS[${i}].lines.join(''))">🔊 读整首</button>
      <button class="btn small" onclick="speak(POEMS[${i}].lines.join('').replace(/[，。]/g,'，'))">🐢 慢速跟读</button></div>
    </div>`).join('');
}

/* ================= 答题 ================= */
let quiz={qs:[],idx:0,right:0,startT:0};
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function genPinyinQ(n){
  const all=LESSONS.flatMap(l=>l.ren.concat(l.xie));
  const qs=[];
  for(let i=0;i<n;i++){
    const c=all[Math.floor(Math.random()*all.length)];
    const wrongs=shuffle(all.filter(x=>x.z!==c.z)).slice(0,3).map(x=>x.p);
    const opts=shuffle([c.p,...wrongs]);
    qs.push({t:'zi',z:c.z,p:c.p,opts,a:opts.indexOf(c.p),why:`“${c.z}”读 ${c.p}`});
  }
  return qs;
}
function genLessonQ(id){
  const l=LESSONS.find(x=>lid(x)===id);
  return (l.quiz||[]).map(q=>({t:'rd',q:q.q,opts:q.opts,a:q.a,why:l.title}));
}
function startQuiz(scope,count){
  let qs=[];
  if(scope==='mix'){
    qs=genPinyinQ(Math.ceil(count*0.6));
    const rqs=shuffle(LESSONS.flatMap(l=>genLessonQ(lid(l)))).slice(0,count-Math.ceil(count*0.6));
    qs=shuffle(qs.concat(rqs));
  } else {
    const lq=genLessonQ(scope);
    const pq=genPinyinQ(count-lq.length);
    qs=shuffle(lq.concat(pq));
  }
  quiz={qs:qs.slice(0,count),idx:0,right:0,startT:Date.now()};
  renderQuiz();
}
function renderQuizCfg(){
  const lbtns = LESSONS.map(l=>`<button class="btn small" onclick="startQuiz('${lid(l)}',8)">${l.sec==='识字'?'识':'课'}${l.no}</button>`).join('');
  $('v-quiz').innerHTML=`
    <div class="card center">
      <div class="conf-label">📌 选范围（拼音题 + 课文理解题）</div>
      <div class="sel-row">
        <button class="btn on" onclick="startQuiz('mix',10)">🎲 混合 10 题</button>
        <button class="btn" onclick="startQuiz('mix',20)">🔥 挑战 20 题</button>
      </div>
      <div class="conf-label">📖 按课文练（每课 8 题）</div>
      <div class="sel-row">${lbtns}</div>
    </div>`;
}
function renderQuiz(){
  const q=quiz.qs[quiz.idx];
  if(!q){ return showQuizResult(); }
  const pct=Math.round(quiz.idx/quiz.qs.length*100);
  const qhtml = q.t==='zi'
    ? `<span class="zi">${q.z}</span>它的读音是？`
    : q.q;
  $('v-quiz').innerHTML=`
    <div class="card">
      <div class="q-head"><span class="prog">第 ${quiz.idx+1} / ${quiz.qs.length} 题</span>
        <button class="btn small pink" onclick="renderQuizCfg()">✖ 退出</button></div>
      <div class="q-bar"><i style="width:${pct}%"></i></div>
      <div class="q-text">${qhtml}</div>
      <div class="opts">${q.opts.map((o,i)=>`<div class="opt" onclick="answer(this,${i})">${o}</div>`).join('')}</div>
      <div class="q-feed" id="qFeed"></div>
    </div>`;
  if(q.t==='zi') setTimeout(()=>speak(q.z),300);
}
function answer(el,i){
  const q=quiz.qs[quiz.idx];
  document.querySelectorAll('.opt').forEach(o=>o.style.pointerEvents='none');
  if(i===q.a){ el.classList.add('right'); quiz.right++;
    $('qFeed').textContent=['太棒了！🎉','答对啦！✨','真聪明！🌟','继续加油！💪'][Math.floor(Math.random()*4)];
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.opt')[q.a].classList.add('right');
    $('qFeed').textContent=`再想一想～正确答案：${q.opts[q.a]}（${q.why}）`;
    speak(q.opts[q.a]);
  }
  setTimeout(()=>{ quiz.idx++; renderQuiz(); }, i===q.a?900:2200);
}
function showQuizResult(){
  const n=quiz.qs.length, acc=Math.round(quiz.right/n*100), sec=Math.round((Date.now()-quiz.startT)/1000);
  const stars = acc===100?'⭐⭐⭐':acc>=80?'⭐⭐':acc>=60?'⭐':'💪';
  saveQuizRecord(acc);
  $('v-quiz').innerHTML=`
    <div class="card center">
      <div class="result-stars">${stars}</div>
      <h2 style="font-family:var(--font-display);margin-bottom:10px">${acc===100?'全部答对，你就是识字小状元！':acc>=60?'很不错，继续练！':'没关系，再来一次！'}</h2>
      <div class="result-nums">
        <div class="rnum"><b>${quiz.right}/${n}</b><span>答对题数</span></div>
        <div class="rnum"><b>${acc}%</b><span>正确率</span></div>
        <div class="rnum"><b>${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</b><span>用时</span></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn mint" onclick="renderQuizCfg()">🔁 再来一轮</button>
        <button class="btn" onclick="showTab('course')">📚 回课文</button>
      </div>
    </div>`;
}

/* ================= Tab 切换 ================= */
function showTab(v){
  ['course','detail','cards','poem','quiz'].forEach(x=>$('v-'+x).classList.toggle('hidden',x!==v));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  if(v==='course'){ renderCourse(); speechSynthesis.cancel(); }
  if(v==='cards'){ buildCards(cardFilter); speechSynthesis.cancel(); }
  if(v==='poem'){ renderPoems(); speechSynthesis.cancel(); }
  if(v==='quiz'){ renderQuizCfg(); }
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showTab(t.dataset.v));
renderCourse();
</script>
